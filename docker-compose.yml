services:
  voc_dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    image: voc_dashboard:latest
    container_name: voc_dashboard
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./dashboard:/app/dashboard
      - ./scripts:/app/scripts
      - ./config:/app/config
      - ./logs:/app/logs
    environment:
      - PORT=8080
      - PYTHONUNBUFFERED=1
