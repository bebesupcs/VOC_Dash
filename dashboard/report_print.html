<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>베베숲 VOC 주간 분석 리포트</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="chartjs-plugin-datalabels.min.js"></script>
<link rel="preconnect" href="https://rsms.me/" />
<link rel="stylesheet" href="https://rsms.me/inter/inter.css" />
<style>
  :root { font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
  .tnum { font-variant-numeric: tabular-nums; }
  canvas { max-height: 260px; }
  @page {
    size: A4 portrait;
    margin: 10mm 12mm;
  }
  * {
    -webkit-print-color-adjust: exact !important;
    print-color-adjust: exact !important;
  }
  body {
    background: #ffffff;
    color: #18181b;
    margin: 0;
    padding: 0;
  }
  #reportView {
    display: block !important;
  }
  /* 인쇄 시 불필요한 버튼/컨트롤 숨김 */
  #reportExportExcel, #reportPrint, .group\/tip, label[title*="토글"] {
    display: none !important;
  }
</style>
</head>
<body class="p-4 sm:p-6 bg-white text-zinc-900 antialiased">

<div id="reportView">
  <article class="mx-auto max-w-5xl bg-white p-2 sm:p-4">
    <div class="flex flex-wrap items-end justify-between gap-3 border-b border-black/10 pb-4">
      <div>
        <p class="text-xs font-medium uppercase tracking-wide text-teal-700">[CX팀] VOC 분석 리포트</p>
        <h2 id="reportTitle" class="mt-1 text-lg font-semibold tracking-tight"></h2>
      </div>
      <div class="flex items-center gap-2">
        <span class="text-xs text-zinc-400 font-medium">베베숲 CX팀 주간 VOC 분석 시스템</span>
      </div>
    </div>

    <!-- 1. VOC 요약 -->
    <section class="mt-5">
      <h3 class="text-sm font-semibold text-zinc-700">1. VOC 요약</h3>
      <div id="reportKpi" class="mt-3 grid grid-cols-2 gap-3 sm:grid-cols-4"></div>
    </section>

    <!-- 2. 채널별 추이 -->
    <section class="mt-6">
      <h3 class="text-sm font-semibold text-zinc-700">2. 채널별 추이 <span id="reportChannelPeriodBadge" class="text-xs font-normal text-zinc-400"></span></h3>
      <div class="mt-3 rounded-lg ring-1 ring-black/5 p-4">
        <canvas id="reportChannelChart"></canvas>
      </div>
    </section>

    <!-- 2.5 AI 상담(ALF 챗봇) 처리율 코멘트 인사이트 배너 -->
    <section id="reportAiAlfInsightSection" class="mt-4 rounded-xl bg-gradient-to-r from-teal-50/70 via-indigo-50/40 to-sky-50/50 p-2.5 px-3.5 ring-1 ring-indigo-200/50 shadow-2xs">
      <div class="flex flex-wrap items-center justify-between gap-2.5">
        <div class="flex items-center gap-2 text-xs">
          <span class="text-base shrink-0">🤖</span>
          <span class="font-bold text-indigo-950">AI 챗봇(ALF) 처리율</span>
          <span id="reportAlfTagRateBadge" class="rounded-full bg-teal-100 px-2 py-0.5 text-[11px] font-extrabold text-teal-800 ring-1 ring-teal-200"></span>
          <span id="reportAlfInsightComment" class="text-zinc-600 font-medium ml-1"></span>
        </div>
        <div id="reportAlfMetricsLine" class="flex items-center gap-2 text-xs bg-white/90 backdrop-blur-xs px-3 py-1 rounded-lg ring-1 ring-black/5 font-medium shadow-2xs"></div>
      </div>
    </section>

    <!-- 3. 부문별 클레임 현황 & 이슈 인사이트 (품질 · 배송 · 서비스 3대 부문 통합) -->
    <section class="mt-6">
      <div class="flex items-center justify-between border-b border-black/10 pb-2">
        <h3 class="text-sm font-semibold text-zinc-800">3. 부문별 클레임 현황 &amp; 이슈 인사이트 <span class="text-xs font-normal text-zinc-400">(품질 · 배송 · 서비스 3개 부문)</span></h3>
        <span class="text-xs text-zinc-400">부문별 발생량 · 증감 추이 · 주요 유형 TOP 5 · 이슈 코멘트</span>
      </div>
      <!-- 품질 / 배송 / 서비스 3개 영역 동적 렌더링 -->
      <div id="reportThreePillars" class="mt-4 grid grid-cols-1 lg:grid-cols-3 gap-4"></div>
    </section>

    <!-- 4. 핵심 리스크 & 긴급 조치 현황 (Risk & Action Summary) -->
    <section id="reportRiskSection" class="mt-6">
      <div class="flex items-center justify-between border-b border-black/10 pb-2">
        <div class="flex items-center gap-2">
          <h3 id="reportRiskSectionHeading" class="text-sm font-semibold text-zinc-800">4. 핵심 리스크 &amp; 이상징후 이슈업 현황 <span class="text-xs font-normal text-zinc-400">(고위험 클레임 · 단순문의 급증)</span></h3>
        </div>
      </div>
      <div id="reportRiskActions" class="mt-3"></div>
    </section>

    <!-- 5. CX팀 종합 코멘트 -->
    <section class="mt-6">
      <h3 id="reportMemoHeading" class="text-sm font-semibold text-zinc-700">5. CX팀 종합 코멘트</h3>
      <div id="reportMemo" class="mt-3 space-y-2"></div>
    </section>

    <p class="mt-8 border-t border-black/10 pt-4 text-center text-xs text-zinc-400">베베숲 CX팀 주간 VOC 분석 시스템 · 채널톡 / 게시판 / 배송 DB 실시간 연동</p>
  </article>
</div>

<!-- 데이터 및 엔진 스크립트 로드 -->
<script src="data.js?v=20261102_1805"></script>
<script src="engine.js?v=20261027_1635"></script>
<script src="render.js?v=20261103_0915"></script>
<script>
  window.addEventListener("DOMContentLoaded", () => {
    try {
      const params = new URLSearchParams(window.location.search);
      const targetWeek = params.get("week") || "2026-W42";
      
      if (window.VOC_ENGINE) {
        window.VOC_ENGINE.setMode("weekly");
        window.VOC_ENGINE.selectPeriod(targetWeek);
      }
      
      // 리포트 렌더링 호출
      if (typeof renderReport === "function") {
        renderReport();
      }

      // 렌더링 완료 플래그
      window.__REPORT_READY__ = true;
      document.body.setAttribute("data-rendered", "true");
    } catch (e) {
      console.error("Report print render error:", e);
    }
  });
</script>
</body>
</html>
